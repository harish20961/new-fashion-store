<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — FashionHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">FashionHub</a>
    <nav class="main-nav">
      <a href="index.html#categories">Men</a>
      <a href="index.html#categories">Women</a>
      <a href="index.html#categories">Footwear</a>
      <a href="index.html#categories">Accessories</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" id="loginLink">Log in</a>
      <a href="cart.html" id="cartLink">Cart</a>
    </div>
  </div>
</header>

<section class="confirmation-section">
  <div class="wrap confirmation-card">
    <h1>Order placed!</h1>
    <p id="orderIdText" class="auth-sub"></p>
    <a href="index.html" class="btn-primary">Continue shopping</a>
  </div>
</section>

<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order_id");
  document.getElementById("orderIdText").textContent = orderId
    ? `Your order id is ${orderId}. Save this for reference.`
    : "";
</script>
</body>
</html>

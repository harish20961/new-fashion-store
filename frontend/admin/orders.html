<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - FashionHub Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-extra.css">
</head>
<body data-page="orders">

<div class="admin-container">

    <aside class="sidebar">
        <div class="logo">
            <h2>FashionHub</h2>
            <span>ADMIN PANEL</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><span>📊</span> Dashboard</a>
            <a href="products.html" class="nav-item"><span>📦</span> Products</a>
            <a href="orders.html" class="nav-item active"><span>🛒</span> Orders</a>
            <a href="users.html" class="nav-item"><span>👥</span> Users</a>
            <a href="reviews.html" class="nav-item"><span>⭐</span> Reviews</a>
        </nav>
        <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h1>Orders</h1>
                <p>View orders and update their status</p>
            </div>
            <div class="admin-profile">
                <div class="profile-icon">A</div>
                <div>
                    <strong id="adminName">Admin</strong>
                    <small>Administrator</small>
                </div>
            </div>
        </header>

        <section class="dashboard-section">
            <div class="admin-toolbar">
                <select id="statusFilter">
                    <option value="">All statuses</option>
                    <option>Placed</option><option>Processing</option>
                    <option>Shipped</option><option>Delivered</option><option>Cancelled</option>
                </select>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" class="empty-message">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="js/admin-pages.js"></script>
</body>
</html>

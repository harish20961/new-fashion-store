<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — FashionHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">FashionHub</a>
    <nav class="main-nav">
      <a href="index.html#categories">Men</a>
      <a href="index.html#categories">Women</a>
      <a href="index.html#categories">Footwear</a>
      <a href="index.html#categories">Accessories</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" id="loginLink">Log in</a>
      <a href="cart.html" id="cartLink">Cart</a>
    </div>
  </div>
</header>

<section class="checkout-section">
  <div class="wrap checkout-grid">
    <div class="checkout-form-card">
      <h1>Delivery address</h1>
      <form id="checkoutForm" class="auth-form">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" required>

        <label for="line1">Address</label>
        <input type="text" id="line1" required>

        <label for="city">City</label>
        <input type="text" id="city" required>

        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" required>

        <div id="checkoutError" class="auth-error"></div>

        <button type="submit" class="btn-primary btn-full">Place order</button>
      </form>
    </div>

    <div class="checkout-summary-card">
      <h2>Order summary</h2>
      <div id="checkoutSummary">
        <p class="status-text">Loading...</p>
      </div>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>

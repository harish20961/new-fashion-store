<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — FashionHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/orders.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">FashionHub</a>
    <nav class="main-nav">
      <a href="index.html#categories">Men</a>
      <a href="index.html#categories">Women</a>
      <a href="index.html#categories">Footwear</a>
      <a href="index.html#categories">Accessories</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" id="loginLink">Log in</a>
        <a href="cart.html" id="cartLink">Cart</a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="wrap auth-wrap">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-sub">Log in with your mobile number — no password needed.</p>
      <p id="authSuccess" class="auth-success"></p>

      <div class="login-tabs">
        <button type="button" id="tabPhone" class="login-tab active">Mobile number</button>
        <button type="button" id="tabEmail" class="login-tab">Email</button>
      </div>

      <!-- Phone + OTP -->
      <form id="phoneForm" class="auth-form" autocomplete="off">
        <div id="phoneStep">
          <label for="phoneName">Your name (only for new customers)</label>
          <input type="text" id="phoneName" maxlength="60" placeholder="Optional">

          <label for="phoneNumber">Mobile number</label>
          <input type="tel" id="phoneNumber" inputmode="numeric" placeholder="98765 43210">

          <button type="button" id="sendOtpBtn" class="btn-primary btn-full">Send OTP</button>
        </div>

        <div id="otpStep" style="display:none">
          <p id="phoneInfo" class="auth-sub"></p>
          <label for="otpCode">Enter OTP</label>
          <input type="text" id="otpCode" inputmode="numeric" maxlength="6" placeholder="6 digit code">

          <button type="button" id="verifyOtpBtn" class="btn-primary btn-full">Verify and log in</button>
          <button type="button" id="changeNumberBtn" class="link-btn">Change number</button>
        </div>

        <div id="phoneError" class="auth-error"></div>
        <div id="recaptchaBox"></div>
      </form>

      <form id="loginForm" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <div id="authError" class="auth-error"></div>

        <button type="submit" class="btn-primary btn-full">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/phone-auth.js"></script>
</body>
</html>

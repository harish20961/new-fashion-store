<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — FashionHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">FashionHub</a>
    <nav class="main-nav">
      <a href="index.html#categories">Men</a>
      <a href="index.html#categories">Women</a>
      <a href="index.html#categories">Footwear</a>
      <a href="index.html#categories">Accessories</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" id="loginLink">Log in</a>
      <a href="cart.html" id="cartLink">Cart (0)</a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="wrap auth-wrap">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-sub">Save addresses, track orders and build a wishlist.</p>

      <form id="registerForm" class="auth-form">
        <label for="name">Full name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="5">

        <div id="authError" class="auth-error"></div>

        <button type="submit" class="btn-primary btn-full">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

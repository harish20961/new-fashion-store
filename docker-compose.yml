services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # live-reload friendly mounts for local development only
      - ./backend:/app/backend
      - ./frontend:/app/frontend

# No local Mongo service on purpose: this project connects to MongoDB Atlas
# via MONGO_URI in your .env file. Open http://localhost:5000 once it is up.
